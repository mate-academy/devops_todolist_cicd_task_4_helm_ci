name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PythonVersion: 3.8
  DockerImageName: ikulyk404/todoapp

jobs:
  source-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload repository artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-artifacts
          path: |
            src
            helm-charts

  python-ci:
    runs-on: ubuntu-latest
    needs: source-code
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Download repository artifacts
        uses: actions/download-artifact@v4
        with:
          name: repo-artifacts
          path: .

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

  docker-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: python-ci
    steps:
    - uses: actions/download-artifact@v4
      name: Download repository artifacts
      with:
        name: repo-artifacts
        path: .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: ./src
        tags: ${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    steps:
      - name: Download helm artifacts
        uses: actions/download-artifact@v4
        with:
          name: repo-artifacts
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm template
        run: helm template todoapp ./helm-charts/todoapp

      - name: Helm lint
        run: helm lint ./helm-charts/todoapp

      - name: Helm package
        run: |
          mkdir -p ./helm-packages
          helm package ./helm-charts/todoapp -d ./helm-packages

      - name: Upload Helm chart package
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-package
          path: ./helm-packages/*.tgz
