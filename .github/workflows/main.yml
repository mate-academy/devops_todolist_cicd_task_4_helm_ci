name: CI/CD Pipeline

on:
  push:
    branches: [ main, your_name ]
  pull_request:
    branches: [ main ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

jobs:
  # Checkout repository - виконується один раз
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload repository as artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository
          path: .
          retention-days: 1

  # Docker build and push job (якщо вже існує)
  docker-build:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: repository

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  # Helm CI job - новий job
  helm-ci:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: repository

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Execute helm template
        run: |
          echo "Running helm template..."
          helm template todoapp ./helm-charts/todoapp

      - name: Execute helm lint
        run: |
          echo "Running helm lint..."
          helm lint ./helm-charts/todoapp

      - name: Package the chart
        run: |
          echo "Packaging helm chart..."
          helm package ./helm-charts/todoapp -d ./packaged-charts

      - name: Upload chart package to GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./packaged-charts/*.tgz
          retention-days: 30