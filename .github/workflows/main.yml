name: Django CI

run-name: Run by ${{ github.actor }} on commit ${{ github.sha }}

on:
  push:
    branches:
      - d4vp
  pull_request:
    branches:
      - d4vp

env:
  PYTHON_VERSION: '3.10'
  DOCKER_IMAGE_NAME: 'django-todo'

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Once per workflow)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

      - name: Run Tests and Generate Coverage
        run: coverage run manage.py test

      - name: Display Coverage Report
        run: coverage report

      - name: Check Code Style (Flake8)
        continue-on-error: true
        run: flake8 .

      - name: Check Code Complexity
        continue-on-error: true
        run: flake8 . --max-complexity=10 --exit-zero

      - name: Upload Codebase for other jobs
        uses: actions/upload-artifact@v4
        with:
          name: codebase
          path: .
          include-hidden-files: true

  docker-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref == 'refs/heads/d4vp'

    steps:
      - name: Download Codebase
        uses: actions/download-artifact@v4
        with:
          name: codebase
          path: .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  helm-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref == 'refs/heads/d4vp'

    steps:
      - name: Download Codebase
        uses: actions/download-artifact@v4
        with:
          name: codebase
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Helm Template
        run: helm template ./chart

      - name: Helm Lint
        run: helm lint ./chart

      - name: Helm Package
        run: helm package ./chart

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: "*.tgz"