name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name }} -${{ github.sha }}

on:
  push:
    branches: ["your_name"]  # Використовуємо вашу гілку замість main
  pull_request:
    branches: ["your_name"]

env:
  PythonVersion: 3.8
  DockerImageName: todoapp

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: .

  docker-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'your_name' }}
    needs: python-ci
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./src
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    runs-on: ubuntu-latest
    needs: docker-ci
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Helm artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: .

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run Helm Template
        run: helm template my-app ./helm-chart

      - name: Run Helm Lint
        run: helm lint ./helm-chart

      - name: Package Helm Chart
        run: helm package ./helm-chart

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: "*.tgz"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: your_name
          title: "Add Helm CI Job"
          body: "This PR adds Helm CI job. [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
