name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}


on:
  push:
    branches: ["vanyas627"]
  pull_request:
    branches: ["main"]

env:
  PythonVersion: 3.8
  DockerImageName: helm_ci

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        working-directory: ./src
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./src
        run: |
          python manage.py test

      - name: Generate Report
        working-directory: ./src
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        working-directory: ./src
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        working-directory: ./src
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: .


  docker-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'vanyas627' }}
    needs: python-ci
    steps:

    - uses: actions/download-artifact@v4
      name: Download python artifacts
      with:
        name: python-artifacts
        path: .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: ./src
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    name: Helm CI
    runs-on: ubuntu-latest
    needs: python-ci
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm Template
        run: helm template todoapp ./helm-charts/todoapp/ -f ./helm-charts/todoapp/values.yaml

      - name: Lint Helm
        run: helm lint ./helm-charts/todoapp/


      - name: Package Helm
        run: helm package ./helm-charts/todoapp/

      - name: Upload Helm package
        uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: ./*.tgz