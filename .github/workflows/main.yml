name: python-deployment
#new
run-name: ${{ github.actor }} - ${{ github.ref_name}} - ${{ github.sha }}

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  PythonVersion: "3.8"
  DockerImageName: todoapp

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: .

  docker-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    steps:
      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./src
          file: ./src/Dockerfile
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:latest

  helm-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    steps:
      - name: Download helm artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: .

      - name: Execute helm template for the chart
        run: helm template todoapp helm-charts/todoapp

      - name: Execute helm lint for the chart
        run: helm lint helm-charts/todoapp

      - name: Package the chart
        run: |
          mkdir -p build
          helm package helm-charts/todoapp -d build/

      - name: Upload the chart package to the GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-package
          path: build/*.tgz
