name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}

on:
  push:
    branches: ["prostoponchik"]
  pull_request:
    branches: ["prostoponchik"]

env:
  PythonVersion: 3.8
  DockerImageName: todoapp

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-artifacts
          path: .
      - name: Upload Helm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: helm-artifacts
          path: ${{ github.workspace }}/helm-charts

  docker-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'prostoponchik' }}
    needs: python-ci
    steps:

    - uses: actions/download-artifact@v7
      name: Download python artifacts
      with:
        name: python-artifacts
        path: .

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        context: ./src
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'prostoponchik' }}
    needs: python-ci
    steps:
    - name: Download helm artifacts
      uses: actions/download-artifact@v7
      with:
        name: helm-artifacts
        path: .
    - name: Set up Helm
      uses: azure/setup-helm@v5.0.1
      with:
        version: v4.2.1
    - name: Test template
      run: helm template todoapp ./todoapp -f ./todoapp/values.yaml

    - name: Lint Helm chart
      run: helm lint ./todoapp/

    - name: Package Helm chart
      run: helm package ./todoapp/

    - name: Upload Helm chart
      uses: actions/upload-artifact@v7
      with:
        name: helm-chart
        path: ./*.tgz